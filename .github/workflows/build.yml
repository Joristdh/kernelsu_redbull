name: Build LineageOS redfin kernel + KSU-Legacy + SuSFS

on:
  workflow_dispatch:
    inputs:
      lineage_zip_url:
        description: 'URL to your installed LineageOS nightly zip (for boot.img base)'
        required: true
  push:
    branches: [ksu-susfs]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source (our fork)
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential bc bison flex libssl-dev \
            libncurses-dev libelf-dev python3 python-is-python3 \
            python3-pip zip unzip curl wget rsync ccache cpio kmod \
            device-tree-compiler gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi lz4

      - name: Integrate KernelSU-Legacy v1.1.1 driver
        working-directory: kernel
        run: |
          # The committed patches only add the Makefile/Kconfig glue + SuSFS.
          # The actual KSU driver code is pulled in at build time via setup.sh.
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Legacy/KernelSU-Legacy/v1.1.1/kernel/setup.sh" | bash -
          ls -la drivers/kernelsu || ls -la KernelSU-Legacy || true

      - name: Identify defconfig
        working-directory: kernel
        run: |
          ls arch/arm64/configs/ | grep -i redbull || true
          DEFCONFIG=$(ls arch/arm64/configs/ | grep -E '^redbull.*defconfig$' | head -1)
          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: no redbull defconfig found"
            ls arch/arm64/configs/
            exit 1
          fi
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "Using defconfig: $DEFCONFIG"
          
          # Sanity check: KSU/SuSFS should already be enabled from cherry-picked commit
          grep "CONFIG_KSU" arch/arm64/configs/$DEFCONFIG || echo "WARN: CONFIG_KSU not found in defconfig"
          grep "CONFIG_KSU_SUSFS" arch/arm64/configs/$DEFCONFIG || echo "WARN: CONFIG_KSU_SUSFS not found"

      - name: Fetch Google prebuilt Clang
        run: |
          CLANG_VER=$(grep -oP 'clang-r\d+\w?' kernel/build.config.common | head -1)
          echo "Kernel wants clang: $CLANG_VER"
          mkdir -p toolchain
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain/clang-src
          if [ ! -d "toolchain/clang-src/$CLANG_VER" ]; then
            echo "Clang $CLANG_VER not found. Available:"
            ls toolchain/clang-src/ | grep clang-r
            exit 1
          fi
          echo "CLANG_PATH=$PWD/toolchain/clang-src/$CLANG_VER/bin" >> $GITHUB_ENV

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$CLANG_PATH:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          make O=out $DEFCONFIG
          make -j$(nproc) O=out 2>&1 | tee build.log
          ls -la out/arch/arm64/boot/

      - name: Upload raw kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/build.log
          if-no-files-found: warn

      - name: Download LineageOS nightly
        run: |
          mkdir -p lineage && cd lineage
          wget -q -O lineage.zip "${{ github.event.inputs.lineage_zip_url }}"
          unzip -o lineage.zip payload.bin
          ls -la payload.bin

      - name: Extract boot.img from payload
        run: |
          git clone --depth=1 https://github.com/vm03/payload_dumper.git
          cd payload_dumper
          pip install -r requirements.txt
          python payload_dumper.py --images boot ../lineage/payload.bin
          cp output/boot.img ../boot-original.img
          ls -la ../boot-original.img

      - name: Fetch magiskboot
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip -o magisk.zip 'lib/x86_64/libmagiskboot.so' -d magisk-extract
          cp magisk-extract/lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

      - name: Repack boot.img with new kernel
        run: |
          mkdir -p repack && cd repack
          cp ../boot-original.img boot.img
          ../magiskboot unpack boot.img

          if [ -f ../kernel/out/arch/arm64/boot/Image.lz4 ]; then
            cp ../kernel/out/arch/arm64/boot/Image.lz4 kernel
          else
            ../magiskboot compress=lz4 ../kernel/out/arch/arm64/boot/Image kernel
          fi

          ../magiskboot repack boot.img new-boot.img
          mv new-boot.img ../boot-ksu-susfs.img
          cd ..
          ls -la boot-ksu-susfs.img

      - name: Upload flashable boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-ksu-susfs
          path: boot-ksu-susfs.imģ
